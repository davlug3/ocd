name: 3D preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Build GLB / STEP / renders in KiCad 9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 3D preview
        run: |
          set -euo pipefail
          docker run --rm --user root \
            -v "${PWD}:/work" -w /work -e HOME=/tmp \
            kicad/kicad:9.0 bash -lc '
              set -euo pipefail
              if ! command -v python3 >/dev/null 2>&1; then
                apt-get update -qq
                apt-get install -y -qq python3 >/dev/null
              fi
              python3 pcb/preview/build_3d.py \
                --board pcb/board/ocd_v0p4_8v18v.kicad_pcb \
                --out-dir pcb/preview
            '

      - name: Debug 3D export
        if: always()
        run: |
          set -euo pipefail
          docker run --rm --user root \
            -v "${PWD}:/work" -w /work -e HOME=/tmp \
            kicad/kicad:9.0 bash -lc '
              set -x
              ls -l pcb/preview/models/Connector_Audio.3dshapes/ || true
              ls -l pcb/preview/*.kicad_pcb || true
              kicad-cli pcb export glb -o /work/pcb/preview/test-orig.glb -f --subst-models \
                -D KICAD9_3DMODEL_DIR=/work/pcb/preview/models \
                /work/pcb/board/ocd_v0p4_8v18v.kicad_pcb 2>&1 | tail -40 || true
              echo "orig rc=${PIPESTATUS[0]}"
              curl -fsSL -o /work/pcb/preview/models/Connector_Audio.3dshapes/Jack_6.35mm_Neutrik_NMJ6HFD2_Horizontal.wrl \
                https://raw.githubusercontent.com/KiCad/kicad-packages3D/master/Resistor_THT.3dshapes/R_Axial_DIN0207_L6.3mm_D2.5mm_P7.62mm_Horizontal.wrl
              kicad-cli pcb export glb -o /work/pcb/preview/test-preview.glb -f --subst-models \
                -D KICAD9_3DMODEL_DIR=/work/pcb/preview/models \
                /work/pcb/preview/ocd_v0p4_8v18v-preview.kicad_pcb 2>&1 | tail -40 || true
              echo "preview rc=${PIPESTATUS[0]}"
            '

      - name: Upload 3D preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocd-3d-preview
          path: |
            pcb/preview/*.glb
            pcb/preview/*-components.step
            pcb/preview/*-3d-*.png
          if-no-files-found: warn